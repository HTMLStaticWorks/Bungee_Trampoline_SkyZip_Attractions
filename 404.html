<!DOCTYPE html>
<html lang="en" dir="ltr" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Not Found | SkyZip</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Poppins:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { primary: '#0ea5e9' }, fontFamily: { sans: ['Inter'], heading: ['Poppins'] } } } }
    </script>
    <style>
        .bounce { animation: bounce 2s infinite; }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-30px); } }
    </style>
</head>
<body class="font-sans antialiased text-gray-900 bg-gray-50 dark:bg-gray-900 dark:text-white h-screen flex flex-col items-center justify-center text-center p-4">

    <!-- 1. Animated Illustration -->
    <div class="mb-8 relative">
        <div class="text-[150px] font-heading font-extrabold text-gray-200 dark:text-gray-800 leading-none">404</div>
        <div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 bounce">
            <i class="fa-solid fa-rocket text-7xl text-primary drop-shadow-2xl"></i>
        </div>
    </div>

    <!-- 2. Error Message -->
    <h1 class="text-3xl md:text-4xl font-heading font-bold mb-4">Oops! You Flew Too Far</h1>
    <p class="text-lg text-gray-500 max-w-lg mx-auto mb-10">We can't seem to find the page you're looking for. It might have been moved or no longer exists.</p>

    <!-- 3. Quick Navigation & 4. Back Home CTA -->
    <div class="flex flex-col sm:flex-row gap-4 justify-center">
        <a href="index.html" class="bg-primary text-white px-8 py-3 rounded-full font-bold hover:bg-cyan transition shadow-lg inline-flex items-center justify-center gap-2">
            <i class="fa-solid fa-house"></i> Back to Home
        </a>
        <a href="contact.html" class="bg-white dark:bg-gray-800 text-gray-900 dark:text-white px-8 py-3 rounded-full font-bold border border-gray-200 dark:border-gray-700 hover:border-primary transition inline-flex items-center justify-center gap-2">
            <i class="fa-solid fa-headset"></i> Contact Support
        </a>
    </div>

</body>
</html>
