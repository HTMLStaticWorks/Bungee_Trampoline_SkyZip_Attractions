<!DOCTYPE html>
<html lang="en" dir="ltr" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Register | SkyZip</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700;800&family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { primary: '#0ea5e9', purple: '#a855f7', charcoal: '#1f2937' }, fontFamily: { sans: ['Inter'], heading: ['Poppins'] } } } }
    </script>
    <link rel="stylesheet" href="assets/css/style.css">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="font-sans antialiased text-gray-900 bg-gray-50 dark:bg-gray-900 h-screen flex">

    <!-- 1. Branding Panel -->
    <div class="hidden lg:flex lg:w-1/2 bg-gradient-to-br from-charcoal to-gray-900 relative overflow-hidden items-center justify-center">
        <div class="absolute inset-0 z-0">
            <img src="assets/img/login-bg.png" alt="Adventure" class="w-full h-full object-cover opacity-30 mix-blend-overlay">
        </div>
        <div class="relative z-10 text-center px-12">
            <a href="index.html" class="text-5xl font-heading font-extrabold flex justify-center items-center gap-2 mb-8 text-white">
                <i class="fa-solid fa-rocket text-primary"></i> <span>Sky<span class="text-primary">Zip</span></span>
            </a>
            <h2 class="text-3xl font-bold text-white mb-4">Your Next Adventure Awaits</h2>
            <p class="text-gray-300 text-lg">Log in to manage your bookings, sign your digital waivers, and access your adventure photos.</p>
        </div>
    </div>

    <!-- 2. Login/Register Form -->
    <div class="w-full lg:w-1/2 flex items-center justify-center p-8 bg-white dark:bg-gray-900 overflow-y-auto">
        <div class="w-full max-w-md" x-data="{ mode: 'login' }">
            <div class="text-center mb-8">
                <h1 class="text-3xl font-heading font-bold dark:text-white" x-text="mode === 'login' ? 'Welcome Back' : 'Create an Account'"></h1>
                <p class="text-gray-500 dark:text-gray-400 mt-2" x-text="mode === 'login' ? 'Enter your details to access your account.' : 'Join the thrill today.'"></p>
            </div>

            <!-- 3. Social Login Options -->
            <div class="flex gap-4 mb-6">
                <button class="w-1/2 flex items-center justify-center gap-2 border border-gray-200 dark:border-gray-700 py-3 rounded-xl hover:bg-gray-50 dark:hover:bg-gray-800 transition dark:text-white font-medium">
                    <i class="fa-brands fa-google text-red-500"></i> Google
                </button>
                <button class="w-1/2 flex items-center justify-center gap-2 border border-gray-200 dark:border-gray-700 py-3 rounded-xl hover:bg-gray-50 dark:hover:bg-gray-800 transition dark:text-white font-medium">
                    <i class="fa-brands fa-apple text-gray-900 dark:text-white"></i> Apple
                </button>
            </div>

            <div class="flex items-center my-6">
                <hr class="flex-grow border-gray-200 dark:border-gray-700">
                <span class="px-4 text-sm text-gray-400">or continue with email</span>
                <hr class="flex-grow border-gray-200 dark:border-gray-700">
            </div>

            <form class="space-y-5">
                <div x-show="mode === 'register'" x-transition>
                    <label class="block text-sm font-bold text-gray-700 dark:text-gray-300 mb-2">Full Name</label>
                    <input type="text" class="w-full bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl px-4 py-3 focus:outline-none focus:border-primary dark:text-white">
                </div>
                
                <div>
                    <label class="block text-sm font-bold text-gray-700 dark:text-gray-300 mb-2">Email Address</label>
                    <input type="email" class="w-full bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl px-4 py-3 focus:outline-none focus:border-primary dark:text-white">
                </div>

                <div>
                    <label class="block text-sm font-bold text-gray-700 dark:text-gray-300 mb-2">Password</label>
                    <input type="password" class="w-full bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl px-4 py-3 focus:outline-none focus:border-primary dark:text-white">
                </div>

                <div x-show="mode === 'login'" class="flex justify-end" x-transition>
                    <a href="#" class="text-sm font-bold text-primary hover:text-purple transition">Forgot Password?</a>
                </div>

                <button type="button" class="w-full bg-primary hover:bg-cyan text-white py-3 rounded-xl font-bold transition shadow-lg shadow-primary/30" x-text="mode === 'login' ? 'Sign In' : 'Create Account'"></button>
            </form>

            <div class="mt-8 text-center text-sm text-gray-600 dark:text-gray-400">
                <span x-text="mode === 'login' ? 'Don\'t have an account?' : 'Already have an account?'"></span>
                <button @click="mode = mode === 'login' ? 'register' : 'login'" class="font-bold text-primary hover:underline ml-1" x-text="mode === 'login' ? 'Sign up' : 'Log in'"></button>
            </div>

            <!-- 4. Security Information -->
            <div class="mt-12 text-center text-xs text-gray-400 flex items-center justify-center gap-2">
                <i class="fa-solid fa-lock"></i> Secure SSL Encryption
            </div>
        </div>
    </div>

</body>
</html>
